[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.11"
name = "kedro_wildcard_inputs"
readme = "README.md"
dynamic = [
    "version",
]
dependencies = [
    "ipython>=8.10",
    "jupyterlab>=3.0",
    "notebook",
    "kedro",
]

[project.scripts]
kedro-wildcard-inputs = "kedro_wildcard_inputs.__main__:main"

[project.entry-points."kedro.hooks"]

[tool.uv.sources]
kedro = { git = "https://github.com/iwhalen/kedro.git", branch = "feat/wildcard-inputs" }

[tool.setuptools.dynamic.version]
attr = "kedro_wildcard_inputs.__version__"

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.kedro]
package_name = "kedro_wildcard_inputs"
project_name = "kedro-wildcard-inputs"
kedro_init_version = "1.8.0"
tools = "['None']"
example_pipeline = "False"
source_dir = "src"
